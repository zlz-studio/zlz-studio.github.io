<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>ZLZ Env Shader</title>
  <link rel="preload" as="script" href="Build/WebGL.loader.js">
  <style>
    html, body { margin:0; padding:0; height:100%; background:#0e1116; overflow:hidden;
                 font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #unity-container { position:absolute; inset:0; }
    #unity-canvas    { width:100%; height:100%; display:block; background:#0e1116; }

    /* ── Loading / optimizing overlay ──────────────────────────────
       Two phases share this curtain :
         1. download   - progress bar driven by the Unity loader.
         2. .checking  - Unity is up but hidden ; the in-game perf check runs behind the curtain
                         while the bar shimmers. The game lifts the curtain via zlzPerfCheckDone
                         (bridged from ZLZ_EnvDemoPerfCheck), so the first visible frame is already
                         at the right quality and smooth. */
    #zlz-loading {
      position:absolute; inset:0; z-index:10;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
      background:radial-gradient(120% 120% at 50% 30%, #14261b 0%, #0e1116 72%);
      color:#e7ecf3; transition:opacity .6s ease;
    }
    #zlz-loading.hidden { opacity:0; pointer-events:none; }

    #zlz-glow {
      position:absolute; inset:0; margin:auto; width:440px; height:440px; border-radius:50%;
      max-width:80vw; max-height:80vw; pointer-events:none;
      background:radial-gradient(circle, rgba(134,239,172,.16) 0%, rgba(56,189,248,.09) 45%, transparent 70%);
      opacity:.45;
    }
    #zlz-loading.checking #zlz-glow { animation:zlzBreath 2.4s ease-in-out infinite; }
    @keyframes zlzBreath {
      0%, 100% { transform:scale(1);    opacity:.3; }
      50%      { transform:scale(1.22); opacity:.75; }
    }

    #zlz-title { font-size:24px; font-weight:600; letter-spacing:.5px; position:relative; }
    #zlz-loading.checking #zlz-title {
      background:linear-gradient(90deg,#e7ecf3 0%, #86efac 38%, #38bdf8 50%, #86efac 62%, #e7ecf3 100%);
      background-size:220% 100%;
      -webkit-background-clip:text; background-clip:text; color:transparent;
      animation:zlzTitleSweep 2.4s linear infinite;
    }
    @keyframes zlzTitleSweep { 0% { background-position:120% 0; } 100% { background-position:-120% 0; } }

    #zlz-sub { font-size:13px; opacity:.5; margin-top:-12px; position:relative; }
    #zlz-loading.checking #zlz-sub { opacity:.85; }
    /* growing-dots "..." while the check runs */
    #zlz-loading.checking #zlz-sub::after {
      content:"..."; display:inline-block; width:0; overflow:hidden;
      vertical-align:bottom; white-space:nowrap;
      animation:zlzDots 1.2s steps(4, end) infinite;
    }
    @keyframes zlzDots { 0% { width:0; } 100% { width:1.15em; } }

    #zlz-bar  { width:320px; max-width:60vw; height:6px; border-radius:6px; position:relative;
                background:rgba(255,255,255,.10); overflow:hidden; }
    #zlz-fill { width:0%; height:100%; border-radius:6px;
                background:linear-gradient(90deg, #86efac, #38bdf8); transition:width .2s ease; }
    /* checking : the bar hands itself to an indeterminate light-sweep, and softly pulses */
    #zlz-loading.checking #zlz-bar {
      overflow:hidden;
      animation:zlzBarPulse 2.4s ease-in-out infinite;
    }
    @keyframes zlzBarPulse {
      0%, 100% { box-shadow:0 0 10px rgba(134,239,172,.15); }
      50%      { box-shadow:0 0 22px rgba(56,189,248,.40); }
    }
    #zlz-loading.checking #zlz-fill {
      width:45%; transition:none;
      background:linear-gradient(90deg, rgba(134,239,172,0), #86efac, #38bdf8, rgba(56,189,248,0));
      animation:zlzSweep 1.15s cubic-bezier(.45,.05,.55,.95) infinite;
    }
    @keyframes zlzSweep { 0% { transform:translateX(-110%); } 100% { transform:translateX(335%); } }
    /* ready : sweep snaps into a full, calm bar for the beat before the curtain lifts */
    #zlz-loading.ready #zlz-fill {
      width:100%; transform:none; animation:none; transition:none;
      background:linear-gradient(90deg, #86efac, #38bdf8);
    }
    #zlz-loading.ready #zlz-bar { animation:none; box-shadow:0 0 18px rgba(134,239,172,.35); }

    #zlz-pct   { font-size:12px; opacity:.65; font-variant-numeric:tabular-nums; }

    /* ── Fullscreen button ─────────────────────────── */
    #zlz-fs { position:absolute; right:14px; bottom:12px; z-index:11;
              width:36px; height:36px; border:0; border-radius:8px; cursor:pointer;
              background:rgba(255,255,255,.10); color:#e7ecf3; font-size:16px; line-height:36px; }
    #zlz-fs:hover { background:rgba(255,255,255,.22); }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="zlz-loading">
      <div id="zlz-glow"></div>
      <div id="zlz-title">ZLZ Env Shader</div>
      <div id="zlz-sub">Loading demo…</div>
      <div id="zlz-bar"><div id="zlz-fill"></div></div>
      <div id="zlz-pct">0%</div>
    </div>

    <button id="zlz-fs" title="Fullscreen" style="display:none">⛶</button>
  </div>

  <script>
    var canvas  = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#zlz-loading");
    var sub     = document.querySelector("#zlz-sub");
    var fill    = document.querySelector("#zlz-fill");
    var pct     = document.querySelector("#zlz-pct");
    var fsBtn   = document.querySelector("#zlz-fs");

    // Cache-buster: bump this on EVERY new build upload. Unity's loader caches the
    // .data file in IndexedDB keyed by URL; a returning visitor whose revalidation
    // fetch fails (flaky network, GitHub hiccup) can otherwise pair an OLD cached
    // .data with the NEW .wasm and crash with "memory access out of bounds" at ~90%.
    // A fresh query string makes every build a fresh cache entry, so the mix can
    // never happen.
    var buildVersion = "2026-08-20-1";

    var config = {
      // Uncompressed build: the browser compiles the wasm while it streams, and
      // no Brotli has to be unpacked in JS (that step cost ~30s on GitHub Pages,
      // which cannot send the "Content-Encoding: br" header these files need).
      dataUrl:      "Build/WebGL.data?v="         + buildVersion,
      frameworkUrl: "Build/WebGL.framework.js?v=" + buildVersion,
      codeUrl:      "Build/WebGL.wasm?v="         + buildVersion,
      streamingAssetsUrl: "StreamingAssets",
      companyName:    "ZLZ Studio",
      productName:    "ZLZ Env Shader",
      productVersion: "0.1.0",
    };

    var script = document.createElement("script");
    script.src = "Build/WebGL.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        var v = Math.round(p * 100);
        fill.style.width = v + "%";
        pct.textContent  = v + "%";
      }).then(function (unity) {
        window.zlzBootMs = Math.round(performance.now());  // handy when tuning load time
        fsBtn.onclick = function () { unity.SetFullscreen(1); };

        // ── Phase 2: the curtain stays up while the in-game perf check runs behind it. ──
        pct.textContent = "";
        fill.style.width = "";                   // clear the inline width so the CSS shimmer takes the bar
        sub.textContent = "Optimizing for your device";
        loading.classList.add("checking");

        var lifted = false;
        function lift(message) {
          if (lifted) return;
          lifted = true;
          loading.classList.remove("checking");
          loading.classList.add("ready");
          sub.textContent = message;
          setTimeout(function () {               // one calm beat on "Ready", then reveal the demo
            loading.classList.add("hidden");
            fsBtn.style.display = "block";
          }, 650);
        }

        // Fired by the game (ZLZ_EnvDemoPerfCheck via its .jslib bridge) once quality is
        // decided and the switch has settled - the demo behind the curtain is now smooth.
        window.zlzPerfCheckDone = function (fps, switched) {
          window.zlzPerfFps = fps;               // kept for our own console checks, never shown
          window.zlzPerfSwitched = !!switched;
          lift(switched ? "Optimized for this device — ready" : "Ready");
        };

        // Parachute: a build without the perf-check component must never strand the visitor
        // behind the curtain. The check itself finishes in ~8s; this is far beyond it.
        setTimeout(function () { lift("Ready"); }, 40000);
      }).catch(function (msg) {
        document.querySelector("#zlz-sub").textContent = "Failed to load demo: " + msg;
        fill.style.background = "#ef4444";
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
